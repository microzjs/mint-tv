name: Publish release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-v1.5.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish approved built APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.5.2 releases/mint-tv-1.5.2.apk --target "$GITHUB_SHA" --title "薄荷电视 1.5.2" --notes-file docs/release-1.5.2.md --latest
