<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薄荷电视 · 导入直播源</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1115;color:#edf5f2;font:16px system-ui,sans-serif}main{max-width:560px;margin:0 auto;padding:32px 22px}small{color:#8b9da5}h1{font-size:27px;margin-bottom:8px}section{background:#152229;border:1px solid #294138;border-radius:16px;padding:20px;margin:22px 0}h2{font-size:19px;margin:0 0 16px}input,button{width:100%;padding:14px;border-radius:10px;font:inherit}input{background:#0b1115;color:#edf5f2;border:1px solid #426052;margin-bottom:14px}button{border:0;background:#69edb4;color:#08251a;font-weight:700;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.7}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#69edb4}footer{font-size:13px;color:#8b9da5;line-height:1.8}</style>
<main><small>MINT TV · LOCAL IMPORT</small><h1>把直播源发送到电视</h1><p>同一局域网内直接传送，无需账号。</p><section><h2>粘贴订阅链接</h2><form id="link"><input id="url" type="url" required placeholder="https://example.com/live.m3u" autocomplete="off"><button>发送订阅链接</button></form></section><section><h2>上传本地文件</h2><form id="upload"><input id="file" type="file" accept=".m3u,.m3u8,.txt" required><button>上传到电视</button></form><small>M3U / M3U8 / TXT，最多 8 MB</small></section><p id="status" role="status" aria-live="polite"></p><footer>订阅网址保留每日更新；文件保留上传内容。二维码会话 10 分钟内有效，电视上关闭窗口即停止接收。请勿分享会话地址。</footer></main>
<script>const status=document.getElementById('status');async function send(path,options){document.querySelectorAll('button').forEach(x=>x.disabled=true);status.textContent='正在发送，请稍候…';try{let r=await fetch(path,options);let text=await r.text();let data;try{data=JSON.parse(text)}catch(_){throw Error(r.status===410?'会话已到期，请在电视上重新打开二维码':text||'无法连接电视')}if(!r.ok||!data.ok)throw Error(data.message||'导入失败');status.textContent='✓ '+data.message}catch(e){status.textContent='未能导入：'+e.message}finally{document.querySelectorAll('button').forEach(x=>x.disabled=false)}}document.getElementById('link').onsubmit=e=>{e.preventDefault();send('api/url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value.trim()})})};document.getElementById('upload').onsubmit=e=>{e.preventDefault();let f=document.getElementById('file').files[0];if(!f)return;if(f.size>8*1024*1024){status.textContent='文件超过 8 MB，请精简后重试';return}send('api/file',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Mint-Filename':encodeURIComponent(f.name)},body:f})};</script></html>
